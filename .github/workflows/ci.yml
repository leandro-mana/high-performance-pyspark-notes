name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Cache virtualenv
        id: cached-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: venv-${{ runner.os }}-${{ hashFiles('**/Pipfile.lock') }}

      - name: Install dependencies
        if: steps.cached-pipenv.outputs.cache-hit != 'true'
        run: pipenv sync --dev

      - name: Run linter
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Cache virtualenv
        id: cached-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: venv-${{ runner.os }}-${{ hashFiles('**/Pipfile.lock') }}

      - name: Install dependencies
        if: steps.cached-pipenv.outputs.cache-hit != 'true'
        run: pipenv sync --dev

      - name: Run tests
        run: make test
